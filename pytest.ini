[pytest]
# Pytest configuration for dawly-doc-AI

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers for selective test execution
markers =
    integration: Integration tests (may be slow)
    slow: Slow tests
    unit: Fast unit tests

# Output options
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    
# Coverage options (if pytest-cov installed)
# --cov=app
# --cov-report=html
# --cov-report=term-missing

# Logging
log_cli = true
log_cli_level = INFO
